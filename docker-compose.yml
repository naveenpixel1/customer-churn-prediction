version: '3.8'

services:
  churn-predictor-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer_churn_prediction_app
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
